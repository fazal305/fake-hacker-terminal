<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A cinematic fake terminal simulation built with HTML, CSS, and vanilla JavaScript."
    />
    <title>Fake Hacker Terminal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="hacker-styles.css" />
  </head>
  <body>
    <main class="terminal-window" aria-labelledby="terminalTitle">
      <header class="terminal-header">
        <div class="window-buttons" aria-hidden="true">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
        </div>

        <h1 id="terminalTitle" class="terminal-title">demo@fazal-labs: ~</h1>
      </header>

      <section
        class="terminal-body"
        id="terminalBody"
        aria-label="Simulated terminal output"
        aria-live="polite"
      >
        <button class="sound-btn" id="soundBtn" type="button">
          Enable Audio
        </button>
      </section>
    </main>

    <script src="hacker-script.js"></script>
  </body>
</html>
